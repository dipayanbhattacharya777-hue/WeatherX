name: WeatherX Live Weather APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create WeatherX
        run: |
          flutter create --org com.weatherx weatherx
          cd weatherx
          flutter pub add http geolocator geocoding

          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

          cat > lib/main.dart <<'EOF'
          import 'dart:convert';
          import 'dart:math' as math;
          import 'package:flutter/material.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:geocoding/geocoding.dart';
          import 'package:http/http.dart' as http;

          void main() => runApp(const WeatherX());

          class WeatherX extends StatelessWidget {
            const WeatherX({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(useMaterial3: true),
                home: const WeatherHome(),
              );
            }
          }

          class WeatherHome extends StatefulWidget {
            const WeatherHome({super.key});

            @override
            State<WeatherHome> createState() => _WeatherHomeState();
          }

          class _WeatherHomeState extends State<WeatherHome>
              with TickerProviderStateMixin {
            late AnimationController sky;
            double? lat;
            double? lon;
            String city = 'Finding location...';
            Map<String, dynamic>? current;
            Map<String, dynamic>? daily;
            bool loading = true;
            String? error;

            @override
            void initState() {
              super.initState();
              sky = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 20),
              )..repeat();
              _loadGPS();
            }

            @override
            void dispose() {
              sky.dispose();
              super.dispose();
            }

            String condition(int code) {
              if (code == 0) return 'Clear Sky';
              if ([1, 2].contains(code)) return 'Partly Cloudy';
              if (code == 3) return 'Overcast';
              if ([45, 48].contains(code)) return 'Foggy';
              if ([51, 53, 55, 56, 57].contains(code)) return 'Drizzle';
              if ([61, 63, 65, 66, 67, 80, 81, 82].contains(code)) return 'Rain';
              if ([71, 73, 75, 77, 85, 86].contains(code)) return 'Snow';
              if ([95, 96, 99].contains(code)) return 'Thunderstorm';
              return 'Weather Update';
            }

            IconData weatherIcon(int code) {
              if (code == 0) return Icons.wb_sunny_rounded;
              if ([1, 2, 3].contains(code)) return Icons.cloud_rounded;
              if ([45, 48].contains(code)) return Icons.foggy;
              if ([51, 53, 55, 56, 57, 61, 63, 65, 80, 81, 82].contains(code)) {
                return Icons.water_drop_rounded;
              }
              if ([71, 73, 75, 77, 85, 86].contains(code)) {
                return Icons.ac_unit;
              }
              return Icons.thunderstorm_rounded;
            }

            Future<void> _loadGPS() async {
              setState(() {
                loading = true;
                error = null;
              });

              try {
                bool enabled = await Geolocator.isLocationServiceEnabled();
                if (!enabled) {
                  throw Exception('Please enable your phone location.');
                }

                LocationPermission permission =
                    await Geolocator.checkPermission();

                if (permission == LocationPermission.denied) {
                  permission = await Geolocator.requestPermission();
                }

                if (permission == LocationPermission.denied ||
                    permission == LocationPermission.deniedForever) {
                  throw Exception(
                    'Location permission is needed. You can search a city instead.',
                  );
                }

                Position position = await Geolocator.getCurrentPosition(
                  locationSettings: const LocationSettings(
                    accuracy: LocationAccuracy.medium,
                  ),
                );

                String name = 'Your Location';
                try {
                  final places = await placemarkFromCoordinates(
                    position.latitude,
                    position.longitude,
                  );
                  if (places.isNotEmpty) {
                    name = places.first.locality ??
                        places.first.subAdministrativeArea ??
                        'Your Location';
                  }
                } catch (_) {}

                await _fetchWeather(
                  position.latitude,
                  position.longitude,
                  name,
                );
              } catch (e) {
                if (!mounted) return;
                setState(() {
                  loading = false;
                  error = e.toString().replaceFirst('Exception: ', '');
                  city = 'Location unavailable';
                });
              }
            }

            Future<void> _fetchWeather(
                double latitude, double longitude, String name) async {
              setState(() {
                loading = true;
                error = null;
              });

              try {
                final uri = Uri.https(
                  'api.open-meteo.com',
                  '/v1/forecast',
                  {
                    'latitude': '$latitude',
                    'longitude': '$longitude',
                    'current':
                        'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m',
                    'daily':
                        'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset',
                    'timezone': 'auto',
                    'forecast_days': '7',
                  },
                );

                final response = await http.get(uri)
                    .timeout(const Duration(seconds: 20));

                if (response.statusCode != 200) {
                  throw Exception('Weather service unavailable.');
                }

                final data = jsonDecode(response.body);

                if (!mounted) return;
                setState(() {
                  lat = latitude;
                  lon = longitude;
                  city = name;
                  current = data['current'];
                  daily = data['daily'];
                  loading = false;
                });
              } catch (e) {
                if (!mounted) return;
                setState(() {
                  loading = false;
                  error = 'Could not load weather. Check your internet.';
                });
              }
            }

            Future<void> _searchCity() async {
              final controller = TextEditingController();

              final query = await showDialog<String>(
                context: context,
                builder: (context) => AlertDialog(
                  backgroundColor: const Color(0xFF1C2B43),
                  title: const Text('Search City'),
                  content: TextField(
                    controller: controller,
                    autofocus: true,
                    style: const TextStyle(color: Colors.white),
                    decoration: const InputDecoration(
                      hintText: 'Enter city name',
                      prefixIcon: Icon(Icons.search),
                    ),
                    onSubmitted: (value) =>
                        Navigator.pop(context, value.trim()),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(context),
                      child: const Text('Cancel'),
                    ),
                    FilledButton(
                      onPressed: () =>
                          Navigator.pop(context, controller.text.trim()),
                      child: const Text('Search'),
                    ),
                  ],
                ),
              );

              final cityName = query?.trim() ?? '';
              if (cityName.isEmpty) return;

              setState(() {
                loading = true;
                error = null;
              });

              try {
                final uri = Uri.https(
                  'geocoding-api.open-meteo.com',
                  '/v1/search',
                  {
                    'name': cityName,
                    'count': '1',
                    'language': 'en',
                    'format': 'json',
                  },
                );

                final response = await http.get(uri)
                    .timeout(const Duration(seconds: 20));

                final data = jsonDecode(response.body);
                final results = data['results'];

                if (results == null || results.isEmpty) {
                  throw Exception('City not found. Try another name.');
                }

                final place = results[0];
                final name = [
                  place['name'],
                  place['admin1'],
                  place['country']
                ].where((x) => x != null && x.toString().isNotEmpty)
                    .join(', ');

                await _fetchWeather(
                  (place['latitude'] as num).toDouble(),
                  (place['longitude'] as num).toDouble(),
                  name,
                );
              } catch (e) {
                if (!mounted) return;
                setState(() {
                  loading = false;
                  error = e.toString().replaceFirst('Exception: ', '');
                });
              }
            }

            Widget glass(Widget child) {
              return Container(
                padding: const EdgeInsets.all(19),
                decoration: BoxDecoration(
                  color: Colors.white.withOpacity(0.075),
                  borderRadius: BorderRadius.circular(25),
                  border: Border.all(
                    color: Colors.white.withOpacity(0.13),
                  ),
                ),
                child: child,
              );
            }

            Widget metric(IconData icon, String label, String value) {
              return Expanded(
                child: Column(
                  children: [
                    Icon(icon, color: Colors.cyanAccent, size: 25),
                    const SizedBox(height: 10),
                    Text(value,
                        style: const TextStyle(
                            fontSize: 17, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 5),
                    Text(label,
                        textAlign: TextAlign.center,
                        style: const TextStyle(
                            fontSize: 10, color: Colors.white60)),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final temp = current?['temperature_2m'];
              final feels = current?['apparent_temperature'];
              final humidity = current?['relative_humidity_2m'];
              final wind = current?['wind_speed_10m'];
              final code = current?['weather_code'];

              return Scaffold(
                body: Stack(
                  children: [
                    Container(
                      decoration: const BoxDecoration(
                        gradient: LinearGradient(
                          begin: Alignment.topLeft,
                          end: Alignment.bottomRight,
                          colors: [
                            Color(0xFF101C3B),
                            Color(0xFF172E50),
                            Color(0xFF090F20),
                          ],
                        ),
                      ),
                    ),
                    AnimatedBuilder(
                      animation: sky,
                      builder: (_, child) => Positioned(
                        top: -80 + 18 * math.sin(sky.value * 2 * math.pi),
                        right: -90,
                        child: Container(
                          height: 270,
                          width: 270,
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            color: Colors.cyanAccent.withOpacity(0.07),
                          ),
                        ),
                      ),
                    ),
                    SafeArea(
                      child: RefreshIndicator(
                        onRefresh: () async {
                          if (lat != null && lon != null) {
                            await _fetchWeather(lat!, lon!, city);
                          } else {
                            await _loadGPS();
                          }
                        },
                        child: ListView(
                          padding: const EdgeInsets.all(21),
                          children: [
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                const Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text('WEATHERX',
                                        style: TextStyle(
                                          fontSize: 20,
                                          letterSpacing: 5,
                                          color: Colors.cyanAccent,
                                          fontWeight: FontWeight.w900,
                                        )),
                                    Text('LIVE WEATHER EXPERIENCE',
                                        style: TextStyle(
                                          fontSize: 9,
                                          letterSpacing: 2,
                                          color: Colors.white54,
                                        )),
                                  ],
                                ),
                                Row(
                                  children: [
                                    IconButton(
                                      onPressed: _loadGPS,
                                      icon: const Icon(
                                        Icons.my_location,
                                        color: Colors.cyanAccent,
                                      ),
                                    ),
                                    IconButton(
                                      onPressed: _searchCity,
                                      icon: const Icon(
                                        Icons.search,
                                        color: Colors.cyanAccent,
                                        size: 29,
                                      ),
                                    ),
                                  ],
                                ),
                              ],
                            ),
                            const SizedBox(height: 30),
                            Center(
                              child: Column(
                                children: [
                                  const Text('CURRENT WEATHER',
                                      style: TextStyle(
                                        letterSpacing: 3,
                                        fontSize: 10,
                                        color: Colors.white54,
                                      )),
                                  const SizedBox(height: 9),
                                  Text(city,
                                      textAlign: TextAlign.center,
                                      style: const TextStyle(
                                        fontSize: 22,
                                        fontWeight: FontWeight.w600,
                                      )),
                                ],
                              ),
                            ),
                            const SizedBox(height: 25),
                            if (loading)
                              const Padding(
                                padding: EdgeInsets.all(45),
                                child: Center(
                                  child: CircularProgressIndicator(
                                    color: Colors.cyanAccent,
                                  ),
                                ),
                              )
                            else if (error != null)
                              glass(Column(
                                children: [
                                  const Icon(Icons.cloud_off,
                                      size: 45, color: Colors.orangeAccent),
                                  const SizedBox(height: 12),
                                  Text(error!, textAlign: TextAlign.center),
                                  const SizedBox(height: 15),
                                  FilledButton.icon(
                                    onPressed: _loadGPS,
                                    icon: const Icon(Icons.refresh),
                                    label: const Text('Try GPS again'),
                                  ),
                                  TextButton(
                                    onPressed: _searchCity,
                                    child: const Text('Search a city instead'),
                                  ),
                                ],
                              ))
                            else ...[
                              Center(
                                child: AnimatedBuilder(
                                  animation: sky,
                                  builder: (_, child) => Transform.rotate(
                                    angle: sky.value * 2 * math.pi,
                                    child: Icon(
                                      weatherIcon((code as num).toInt()),
                                      size: 112,
                                      color: Colors.amberAccent,
                                    ),
                                  ),
                                ),
                              ),
                              const SizedBox(height: 8),
                              Center(
                                child: Text(
                                  '${(temp as num).round()}°',
                                  style: const TextStyle(
                                    fontSize: 78,
                                    fontWeight: FontWeight.w200,
                                    height: 1.1,
                                  ),
                                ),
                              ),
                              Center(
                                child: Text(
                                  condition((code as num).toInt()),
                                  style: con
